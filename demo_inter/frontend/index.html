    <script>
      // Tema class'ini React mount olmadan / ilk boyamadan ONCE uygula.
      // Bu olmadan sayfa her acilista yanlis temayla bir an render olup
      // (FOUC) bazi metinlerin zeminle ayni renge dusmesine yol aciyordu.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.classList.toggle("dark", theme === "dark");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <style>
      html.dark body { background: #050814; }
      html:not(.dark) body { background: #f8fafc; }
    </style>
