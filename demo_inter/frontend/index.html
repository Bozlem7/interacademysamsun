<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Inter Academy</title>
    <script>
      // Tema class'ini React mount olmadan / ilk boyamadan ONCE uygula.
      // Bu olmadan sayfa her acilista yanlis temayla bir an render olup
      // (FOUC) bazi metinlerin zeminle ayni renge dusmesine yol aciyordu.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.classList.toggle("dark", theme === "dark");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <style>
      html.dark body { background: #050814; }
      html:not(.dark) body { background: #f8fafc; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
